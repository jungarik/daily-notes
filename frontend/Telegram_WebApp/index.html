<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Notes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:            #1e1e1e;   /* Obsidian dark primary */
    --bg-alt:        #191919;
    --bg-elev:       #262626;
    --border:        #333333;
    --text:          #dcddde;
    --text-muted:    #8a8a8e;
    --text-faint:    #6a6a6e;
    --accent:        #a482ff;   /* Obsidian violet */
    --accent-soft:   rgba(164,130,255,0.14);
    --hover:         rgba(255,255,255,0.05);
    --mono: "JetBrains Mono","SFMono-Regular",ui-monospace,"Cascadia Code",
            Consolas,"Liberation Mono",Menlo,monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 300;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* Instagram-style stats header (glass) */
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; justify-content: center; gap: 30px;
    padding: 14px 52px;
    background: rgba(25,25,25,.72);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--border);
  }
  .stat { text-align: center; min-width: 54px; }
  .stat b { display: block; font-size: 19px; font-weight: 600; color: var(--text); line-height: 1.15; }
  .stat span { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }

  /* Floating liquid-glass bottom tab bar */
  /* Floating dock: chat circle (left) · tab pill (center) · search circle (right) */
  .dock {
    position: fixed; left: 0; right: 0;
    bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; justify-content: center;
    gap: 12px; padding: 0 16px; z-index: 40; pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .fab {
    flex: none; width: 54px; height: 54px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: var(--text-muted); cursor: pointer;
    background: rgba(48,48,48,.55);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 10px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    transition: background .15s ease, color .15s ease;
  }
  .fab svg { width: 20px; height: 20px; }
  .fab.active { background: rgba(255,255,255,.16); color: var(--text); }
  .tabbar {
    display: flex; gap: 4px; padding: 6px; border-radius: 999px;
    background: rgba(48,48,48,.55);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 10px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .tabbar .tab {
    display: flex; align-items: center; gap: 7px;
    padding: 13px 18px; border: none; border-radius: 999px;
    background: transparent; color: var(--text-muted);
    font: inherit; font-size: 13px; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tabbar .tab.active { background: rgba(255,255,255,.16); color: var(--text); }
  .tabbar .tab svg { width: 18px; height: 18px; }

  /* Shared input (search / chat) embedded in the floating pill */
  .tab-icons { display: flex; gap: 4px; }
  .tab-icons.hidden, .tab-input.hidden { display: none; }
  .tab-input { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; }
  .tab-input .ts-ico { width: 16px; height: 16px; color: var(--text-muted); flex: none; }
  .tab-input input { width: 150px; max-width: 38vw; background: transparent; border: none; outline: none; color: var(--text); font: inherit; font-size: 15px; }
  /* Input mode: let the pill stretch toward the borders and the field fill it. */
  .dock.input .tabbar { flex: 1; }
  .dock.input .tab-input { width: 100%; }
  .dock.input .tab-input input { flex: 1; width: auto; max-width: none; }
  .tab-input .ts-send { border: none; background: #2f6feb; color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; flex: none; display: flex; align-items: center; justify-content: center; }
  .tab-input .ts-send svg { width: 16px; height: 16px; }
  .fab.hidden { display: none; }

  /* Notes feed — full-preview posts */
  #notes:not(.hidden) { display: flex; flex-direction: column; gap: 12px; padding: 6px 4px 0; }

  .view.hidden { display: none; }

  /* Image carousel (Instagram-style: horizontal swipe + snap, dots) */
  .carousel { position: relative; margin: 10px 0; }
  .carousel .track {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
    gap: 0; border-radius: 12px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; background: rgba(0,0,0,.25);
  }
  .carousel .track::-webkit-scrollbar { display: none; }
  .carousel .slide {
    flex: 0 0 100%; scroll-snap-align: center; display: flex;
    align-items: center; justify-content: center;
  }
  .carousel .slide img {
    width: 100%; max-height: 60vh; object-fit: contain; display: block;
  }
  .carousel .dots {
    position: absolute; left: 0; right: 0; bottom: 8px;
    display: flex; justify-content: center; gap: 6px; pointer-events: none;
  }
  .carousel .dots i {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.55); transition: background .15s ease;
  }
  .carousel .dots i.on { background: #fff; }
  .carousel .count {
    position: absolute; top: 8px; right: 8px; padding: 2px 8px;
    font-size: 12px; color: #fff; background: rgba(0,0,0,.5);
    border-radius: 999px; pointer-events: none;
  }

  /* Chat conversation */
  #chat:not(.hidden) { display: flex; flex-direction: column; gap: 8px; padding: 6px 4px 0; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #2f6feb; color: #fff; border-bottom-right-radius: 5px; }
  .msg.bot { align-self: flex-start; background: var(--bg-alt); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .msg.bot.muted { color: var(--text-muted); }
  .chat-empty { color: var(--text-muted); text-align: center; padding: 24px 12px; font-size: 14px; }
  .typing { display: inline-flex; gap: 3px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: blink 1.2s infinite both; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

  main { flex: 1; overflow-y: auto; padding: 6px 8px 112px; }   /* bottom room for floating tab bar */

  .row {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .row:hover { background: var(--hover); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .dots {
    flex: none; margin-left: 6px;
    padding: 0 5px; border-radius: 4px;
    color: var(--text-faint); font-size: 16px; line-height: 1;
    cursor: pointer;
  }
  .row .dots:hover { color: var(--text); background: var(--hover); }

  .folder > .row { position: relative; }
  /* Dashed line descending from under an open folder into its children. */
  .folder.open > .row::after {
    content: ""; position: absolute;
    left: 15px; top: calc(50% + 8px); bottom: 0;   /* start below the folder icon, centered under it */
    border-left: 1px dashed var(--border);
  }
  .folder .children { display: none; margin-left: 15px; padding-left: 4px; }
  .folder.open > .children { display: block; }

  /* Tree guides: a dashed vertical line per node + a dashed connector to it.
     The LAST node's vertical stops at the connector (└), not continuing past it. */
  .children > .file,
  .children > .folder,
  .children > .folder > .row { position: relative; }
  .children > .file::before,
  .children > .folder > .row::before {           /* horizontal connector */
    content: ""; position: absolute;
    left: -4px; top: 50%; width: 8px;
    border-top: 1px dashed var(--border);
  }
  .children > .file::after,
  .children > .folder::after {                    /* vertical guide */
    content: ""; position: absolute;
    left: -4px; top: 0; height: 100%;
    border-left: 1px dashed var(--border);
  }
  .children > .file:last-child::after,
  .children > .folder:last-child::after {
    height: 16px;                                 /* stop at the connector */
  }

  .file .name { color: var(--text); }
  .file .name .ext { color: var(--text-faint); }
  .file.active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .row.selected { background: var(--accent-soft); }

  .ico { flex: none; opacity: .85; }
  .folder > .row .ico { color: var(--text-muted); }
  .file .ico { color: var(--text-muted); }

  .empty { text-align: center; color: var(--text-faint); padding: 48px 20px; font-size: 13px; }

  /* Note card (stub for now) */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 50;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    padding: 14px 18px calc(26px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%);
    transition: transform .22s cubic-bezier(.2,.8,.2,1);
    max-height: 85%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 36px; height: 4px; border-radius: 3px; background: var(--border); margin: 0 auto 12px; }
  /* Preview content — shared by the bottom sheet and the Notes feed posts */
  .card-title { font-size: 16px; font-weight: 400; word-break: break-word; }
  .card-path { margin-top: 4px; color: var(--accent); font-size: 12px; }
  .card-meta { margin-top: 6px; color: var(--text-faint); font-size: 12px; }
  .card-body { margin-top: 14px; color: var(--text-muted); font-size: 13px; line-height: 1.5; border-top: 1px dashed var(--border); padding-top: 12px; white-space: pre-wrap; word-break: break-word; }
  .card-body.muted { color: var(--text-faint); font-style: italic; }
  .card-links { margin-top: 14px; }
  .card-links:empty { display: none; }
  .links-label { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 6px; }
  .links-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .link-chip { display: inline-flex; align-items: center; max-width: 100%; padding: 5px 10px; font: inherit; font-size: 12px; color: var(--text); background: var(--bg-elev, #262626); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link-chip:active { background: var(--border); }

  /* Notes feed — each note as a full-preview post */
  .post { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 14px; padding: 14px 14px 16px; }
  .post-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .post-head .card-title { flex: 1; min-width: 0; }
  .card-title .card-date { color: var(--text-muted); font-weight: 400; font-size: 12px; margin-left: 8px; white-space: nowrap; }
  .post .post-dots { flex: none; color: var(--text-faint); cursor: pointer; padding: 0 4px; line-height: 1.2; }
  /* In the preview sheet the card fills the sheet (no nested card chrome). */
  .sheet .post { background: transparent; border: none; border-radius: 0; padding: 0; }
  /* ⋮ context menu (dropdown at the dots) + change-path input */
  .ctx-menu { position: fixed; z-index: 30; min-width: 150px; padding: 4px; background: var(--bg-elev, #262626); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.45); display: none; }
  .ctx-menu.show { display: block; }
  .ctx-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; color: var(--text); background: transparent; border: none; border-radius: 6px; padding: 9px 12px; cursor: pointer; }
  .ctx-item:active { background: var(--border); }
  #pathSheet .path-input { margin-top: 14px; width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; color: var(--text); background: var(--bg, #1e1e1e); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
  #pathSheet .path-input:focus { outline: none; border-color: var(--accent); }
  #pathSheet .path-error { min-height: 16px; margin-top: 6px; color: #e5736b; font-size: 12px; }
  #pathSheet .path-actions { margin-top: 8px; display: flex; gap: 8px; justify-content: flex-end; }
  #pathSheet .path-btn { font: inherit; font-size: 14px; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--border); }
  #pathSheet .path-btn.ghost { background: transparent; color: var(--text-muted); }
  #pathSheet .path-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Header filter button (top-right) */
  .hdr-filter { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 50%; background: transparent; color: var(--text-muted); cursor: pointer; }
  .hdr-filter svg { width: 18px; height: 18px; }
  .hdr-filter.active { color: #fff; background: var(--accent); border-color: var(--accent); }
  .hdr-filter.hidden { display: none; }

  /* Filter sheet: indented folder tree with tri-state checkboxes */
  #filterSheet .filter-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #filterSheet .filter-quick { display: flex; gap: 6px; }
  .filter-link { background: none; border: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 6px; }
  .filter-tree { margin-top: 10px; max-height: 46vh; overflow-y: auto; }
  .filter-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; cursor: pointer; }
  .filter-row input { width: 18px; height: 18px; flex: none; accent-color: var(--accent); margin: 0; }
  .filter-name { flex: 1; min-width: 0; color: var(--text); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filter-count { flex: none; color: var(--text-faint); font-size: 12px; }
  /* Connections map */
  #map { padding: 0; position: relative; }
  #graph { display: block; width: 100%; height: calc(100vh - 150px); touch-action: none; }
  .map-hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: var(--text-faint); font-size: 11px; pointer-events: none; }

  /* Map: ego reset chip (top) + focused-node card (bottom, above the dock) */
  .ego-reset {
    position: absolute; top: 10px; left: 12px; z-index: 6;
    font: inherit; font-size: 12px; color: var(--text); cursor: pointer;
    padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(48,48,48,.7);
    -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
  }
  .ego-reset.hidden, .focus-card.hidden { display: none; }
  .focus-card {
    position: absolute; left: 12px; right: 12px; bottom: 104px; z-index: 6;
    padding: 12px 14px 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(40,40,40,.86);
    -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
    box-shadow: 0 12px 36px rgba(0,0,0,.5);
  }
  .focus-close { position: absolute; top: 8px; right: 10px; border: none; background: rgba(255,255,255,.12); color: var(--text); width: 26px; height: 26px; border-radius: 50%; font-size: 12px; cursor: pointer; }
  .focus-title { font-size: 15px; font-weight: 600; color: var(--text); padding-right: 28px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .focus-path { font-size: 12px; color: var(--text-muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .focus-meta { font-size: 12px; color: var(--text-faint); margin-top: 4px; min-height: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .focus-actions { display: flex; gap: 8px; margin-top: 11px; }
  .focus-btn { flex: 1; font: inherit; font-size: 13px; padding: 9px 6px; border-radius: 10px; cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text); }
  .focus-btn:active { background: rgba(255,255,255,.14); }
  .row.flash { animation: rowflash 1.4s ease; }
  @keyframes rowflash { 0%, 100% { background: transparent; } 25% { background: rgba(47,111,235,.35); } }
</style>
</head>
<body>
  <header>
    <div class="stat"><b id="statNotes">0</b><span>Notes</span></div>
    <div class="stat"><b id="statLinks">0</b><span>Links</span></div>
    <div class="stat"><b id="statReminders">0</b><span>Reminders</span></div>
    <button class="hdr-filter" id="filterBtn" aria-label="Filter folders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
    </button>
  </header>

  <main>
    <div id="notes" class="view"></div>
    <div id="tree" class="view hidden"></div>
    <div id="map" class="view hidden">
      <canvas id="graph"></canvas>
      <div class="map-hint">tap a node · drag to pan · pinch / scroll to zoom</div>
      <button class="ego-reset hidden" id="egoReset">✕ Full graph</button>
      <div class="focus-card hidden" id="focusCard">
        <button class="focus-close" id="focusClose" aria-label="Close">✕</button>
        <div class="focus-title" id="focusTitle"></div>
        <div class="focus-path" id="focusPath"></div>
        <div class="focus-meta" id="focusMeta"></div>
        <div class="focus-actions">
          <button class="focus-btn" id="focusNeighbors">Neighbors</button>
          <button class="focus-btn" id="focusOpen">Open note</button>
          <button class="focus-btn" id="focusOutline">Outline</button>
        </div>
      </div>
    </div>
    <div id="search" class="view hidden">
      <div id="searchResults"></div>
    </div>
    <div id="chat" class="view hidden">
      <div id="chatLog"></div>
    </div>
  </main>

  <div class="dock" id="dock">
    <button class="fab" id="chatFab" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9A1.5 1.5 0 0 1 18.5 16H9l-4 3.5V16H5.5A1.5 1.5 0 0 1 4 14.5v-9Z"/></svg>
    </button>
    <nav class="tabbar">
      <div class="tab-icons" id="tabIcons">
        <button class="tab active" data-view="notes" aria-label="Notes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="6" rx="1.6"/><rect x="4" y="14" width="16" height="6" rx="1.6"/></svg>
        </button>
        <button class="tab" data-view="map" aria-label="Map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="18" r="2.3"/><circle cx="18.5" cy="15" r="2.3"/><circle cx="14" cy="5.5" r="2.3"/><path d="M7.9 16.6 12.4 7.4M16.3 13.4 8.1 17.1"/></svg>
        </button>
        <button class="tab" data-view="browser" aria-label="Browser">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>
        </button>
      </div>
      <div class="tab-input hidden" id="tabInput">
        <svg class="ts-ico" id="barIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="barInput" type="text" placeholder="Search notes…" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button class="ts-send" id="barSend" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </nav>
    <button class="fab" id="searchFab" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <div id="sheetCard"></div>
  </div>

  <div class="sheet-backdrop" id="menuBackdrop"></div>
  <div class="ctx-menu" id="ctxMenu">
    <button class="ctx-item" id="menuChangePath">📁 Change path</button>
  </div>

  <div class="sheet" id="pathSheet">
    <div class="grip"></div>
    <div class="card-title" id="pathTitle">Change path</div>
    <input class="path-input" id="pathInput" type="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="Projects/idea" />
    <div class="path-error" id="pathError"></div>
    <div class="path-actions">
      <button class="path-btn ghost" id="pathCancel">Cancel</button>
      <button class="path-btn primary" id="pathSave">Save</button>

<script>
"use strict";

/* ------- Telegram Mini App integration (no-op in a plain browser) ------- */

/* ------- Data source -------

   window.__API_BASE__ (e.g. the deployed API URL) and this will call
   GET {API_BASE}/webapp/notes with the Telegram initData for auth, expecting
   [{ id, title, path }]. Until then it falls back to SAMPLE_NOTES so the UI
   renders on its own. */

// URL is a fallback. (A bare host with no scheme would be treated as a relative
// path and fail — always include https://.)
window.__API_BASE__ = window.__API_BASE__
  || location.origin
  || "https://scintillating-celebration-production-69b8.up.railway.app";

const SAMPLE_NOTES = [
  { id: 1,  title: "Refactor bot to call API", path: "Projects/daily-notes", links: 3 },
  { id: 2,  title: "Atomize multi-idea dumps", path: "Projects/daily-notes", links: 2 },
  { id: 3,  title: "Google Calendar integration idea", path: "Projects/daily-notes", links: 1 },
  { id: 4,  title: "Ship the note-browser mini app", path: "Projects/webapp", links: 2 },
  { id: 5,  title: "Mindmap graph view (later)", path: "Projects/webapp", links: 0 },

async function fetchNotes() {

/* ------- Tree building ------- */
function buildTree(notes) {
  const root = { folders: {}, files: [] };
  for (const n of notes) {
    const path = (n.path || "Inbox").trim() || "Inbox";
    const parts = path.split("/").map(p => p.trim()).filter(Boolean);
    let node = root;
    for (const part of parts) {
      node.folders[part] = node.folders[part] || { folders: {}, files: [] };
      node = node.folders[part];
    }
    node.files.push(n);
  }
  return root;
}

function countNotes(node) {
  let c = node.files.length;
  for (const k in node.folders) c += countNotes(node.folders[k]);
  return c;
}

function countLinks(node) {
  let c = 0;
  for (const f of node.files) c += (f.links || 0);
  for (const k in node.folders) c += countLinks(node.folders[k]);
  return c;
}

/* ------- Header stats (Instagram-style; scoped to the selected folder) ------- */
let selectedRow = null;
function setStatus(folder, notes, links) {
  document.getElementById("statNotes").textContent = notes;
  document.getElementById("statLinks").textContent = links;
}
function selectFolder(node, rowEl, path) {
  if (selectedRow) selectedRow.classList.remove("selected");
  if (rowEl) { rowEl.classList.add("selected"); selectedRow = rowEl; }
  setStatus(path, countNotes(node), countLinks(node));
}

/* ------- Icons ------- */
const folderSvg =
  '<svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>';
const fileSvg =
  '<svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v5h5"/><line x1="8" y1="12" x2="14" y2="12"/><line x1="8" y1="15.5" x2="14" y2="15.5"/><line x1="8" y1="19" x2="11.5" y2="19"/></svg>';

/* ------- Rendering ------- */
function renderFolder(name, node, forceOpen, path) {
  const el = document.createElement("div");
  el.className = "folder" + (forceOpen ? " open" : "");
  const header = document.createElement("div");
  header.className = "row";
  // Root folders (no "/" in their path) aren't renameable — no ⋮ menu for them.
  const isRoot = path.indexOf("/") < 0;
  header.innerHTML =
    folderSvg +
    '<span class="name">' + escapeHtml(name) + '</span>' +
    (isRoot ? "" : '<span class="dots" role="button" aria-label="menu">⋮</span>');
  const dotsEl = header.querySelector(".dots");
  if (dotsEl) dotsEl.addEventListener("click", (e) => {
    e.stopPropagation();
    openMenu({ type: "folder", path, name }, e.currentTarget);
  });
  const children = document.createElement("div");
  children.className = "children";

  const folderNames = Object.keys(node.folders).sort((a, b) => a.localeCompare(b));
  for (const f of folderNames) children.appendChild(renderFolder(f, node.folders[f], forceOpen, path + "/" + f));
  const files = node.files.slice().sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  for (const file of files) children.appendChild(renderFile(file));

  header.addEventListener("click", () => {
    el.classList.toggle("open");
    selectFolder(node, header, path);
  });
  el.appendChild(header);
  el.appendChild(children);
  return el;
}

function renderFile(note) {
  const el = document.createElement("div");
  el.className = "row file";
  el.dataset.id = note.id;   // lets the Map's Outline action locate this row
  const title = (note.title && note.title.trim()) || "untitled";

    '<span class="ext">.md</span></span>' +
    '<span class="dots" role="button" aria-label="menu">⋮</span>';
  el.querySelector(".dots").addEventListener("click", (e) => {
    e.stopPropagation();
    openMenu({ type: "note", id: note.id, path: note.path, name: title }, e.currentTarget);
  });
  el.addEventListener("click", () => openCard(note, el));
  return el;
}

function renderTree(notes) {
  const notesArr = Array.isArray(notes) ? notes : [];
  const root = buildTree(notesArr);
  const mount = document.getElementById("tree");
  mount.innerHTML = "";
  selectedRow = null;
  setStatus("All", countNotes(root), countLinks(root));   // default scope: the whole vault

  const rootFolders = Object.keys(root.folders).sort((a, b) => a.localeCompare(b));
  if (!rootFolders.length && !root.files.length) {
    mount.innerHTML = '<div class="empty">No notes yet.<br>Send one to the bot to get started.</div>';
    return;
  }
  for (const f of rootFolders) mount.appendChild(renderFolder(f, root.folders[f], false, f));
  for (const file of root.files) mount.appendChild(renderFile(file));
}

/* ------- Note card ------- */
let activeEl = null;
let cardReq = 0;   // guards against a stale fetch landing after a newer card opens

async function fetchNote(id) {
  const base = window.__API_BASE__;
  if (!base) return null;
  try {
    const res = await fetch(base.replace(/\/$/, "") + "/webapp/notes/" + encodeURIComponent(id), {
      headers: { "X-Telegram-Init-Data": INIT_DATA },
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (e) {
    console.warn("Note detail unavailable:", e);
    return null;

}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

// Direction (links vs backlinks) is kept in the API for the map; here we show a
// single de-duplicated "Linked notes" list.
function linkedItems(detail) {
  const seen = new Set(), items = [];
  for (const it of [...(detail.links || []), ...(detail.backlinks || [])]) {
    if (seen.has(it.id)) continue;
    seen.add(it.id); items.push(it);
  }
  return items;
}
function fillLinks(wrap, detail) {
  wrap.innerHTML = "";
  const items = linkedItems(detail);
  const label = document.createElement("div");
  label.className = "links-label";
  label.textContent = items.length ? "🔗 Linked notes" : "No linked notes yet";
  wrap.appendChild(label);
  if (!items.length) return;
  const row = document.createElement("div");
  row.className = "links-row";
  for (const it of items) {
    const b = document.createElement("button");
    b.className = "link-chip";
    b.textContent = "🔗 " + (it.title || "untitled");
    b.addEventListener("click", () => openCard({ id: it.id, title: it.title }, null));
    row.appendChild(b);
  }
  wrap.appendChild(row);
}
function dateText(detail) { return fmtDate(detail.created_at); }
function tagsText(detail) {
  return (detail.tags && detail.tags.length) ? "🏷 " + detail.tags.join(", ") : "";
}

// Attachment URLs come back relative (/webapp/attachments/…); resolve them
// against the API origin so they load even when it differs from the page.
function mediaUrl(u) {
  if (!u) return u;
  if (/^https?:\/\//.test(u)) return u;
  const base = window.__API_BASE__ ? window.__API_BASE__.replace(/\/$/, "") : "";
  return base + u;
}

// A horizontal, swipeable image carousel (Instagram-style) with a position
// counter + dots. Returns null when there are no attachments.
function buildCarousel(atts) {
  if (!atts || !atts.length) return null;
  const wrap = document.createElement("div");
  wrap.className = "carousel";
  const track = document.createElement("div");
  track.className = "track";
  for (const a of atts) {
    const slide = document.createElement("div");
    slide.className = "slide";
    const img = document.createElement("img");
    img.loading = "lazy"; img.decoding = "async"; img.alt = "";
    img.src = mediaUrl(a.url);
    slide.appendChild(img);
    track.appendChild(slide);
  }
  wrap.appendChild(track);
  if (atts.length > 1) {
    const count = document.createElement("div");
    count.className = "count"; count.textContent = "1/" + atts.length;
    wrap.appendChild(count);
    const dots = document.createElement("div");
    dots.className = "dots";
    atts.forEach((_, i) => {
      const d = document.createElement("i");
      if (i === 0) d.classList.add("on");
      dots.appendChild(d);
    });
    wrap.appendChild(dots);
    track.addEventListener("scroll", () => {
      const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      count.textContent = (i + 1) + "/" + atts.length;
      dots.querySelectorAll("i").forEach((el, j) => el.classList.toggle("on", j === i));
    }, { passive: true });
  }
  return wrap;
}

// THE note card — one template shared by the feed and the browser's preview
// sheet: images on top, then the header (title with the date at its end, and the
// ⋮ menu), path, tags, full text and linked notes.
function buildPost(detail) {
  const post = document.createElement("div");
  post.className = "post";

  const car = buildCarousel(detail.attachments);
  if (car) post.appendChild(car);

  const head = document.createElement("div");
  head.className = "post-head";
  const title = document.createElement("div");
  title.className = "card-title"; title.textContent = (detail.title || "untitled") + ".md";
  const dt = dateText(detail);
  if (dt) { const d = document.createElement("span"); d.className = "card-date"; d.textContent = dt; title.appendChild(d); }
  head.appendChild(title);
  const dots = document.createElement("span");
  dots.className = "post-dots"; dots.setAttribute("role", "button"); dots.textContent = "⋮";
  dots.addEventListener("click", (e) => {
    e.stopPropagation();
    openMenu({ type: "note", id: detail.id, path: detail.path, name: detail.title || "untitled" }, e.currentTarget);
  });
  head.appendChild(dots);
  post.appendChild(head);

  const path = document.createElement("div");
  path.className = "card-path"; path.textContent = "📁 " + (detail.path || "Inbox");
  post.appendChild(path);
  const tg2 = tagsText(detail);
  if (tg2) { const meta = document.createElement("div"); meta.className = "card-meta"; meta.textContent = tg2; post.appendChild(meta); }

  const text = (detail.text || "").trim();
  const hasImages = detail.attachments && detail.attachments.length;
  const body = document.createElement("div"); body.className = "card-body";
  if (text) body.textContent = text;
  else if (!hasImages) { body.textContent = "(empty note)"; body.classList.add("muted"); }
  if (text || !hasImages) post.appendChild(body);   // no empty text line under an image-only note

  const links = document.createElement("div"); links.className = "card-links";
  fillLinks(links, detail);
  post.appendChild(links);
  return post;
}

async function openCard(note, el) {
  if (activeEl) activeEl.classList.remove("active");
  activeEl = null;
  if (el) { el.classList.add("active"); activeEl = el; }   // el is null for link navigation
  const mount = document.getElementById("sheetCard");
  mount.innerHTML = '<div class="empty">Loading…</div>';
  document.getElementById("sheet").classList.add("show");
  document.getElementById("backdrop").classList.add("show");
  tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();

  const req = ++cardReq;
  const detail = await fetchNote(note.id);
  if (req !== cardReq) return;   // a newer card was opened meanwhile

  if (!detail) {
    mount.innerHTML = '<div class="empty">Preview unavailable.</div>';
    return;
  }
  // Same card template as the feed.
  mount.innerHTML = "";
  mount.appendChild(buildPost(detail));
}
function closeCard() {
  document.getElementById("sheet").classList.remove("show");
  document.getElementById("backdrop").classList.remove("show");
  if (activeEl) { activeEl.classList.remove("active"); activeEl = null; }
}
document.getElementById("backdrop").addEventListener("click", closeCard);

/* ------- ⋮ context menu + change-path sheet ------- */
let menuTarget = null;   // { type:'folder'|'note', path, id?, name }
function closeCtxMenu() { document.getElementById("ctxMenu").classList.remove("show"); }
function hideActionSheets() {
  closeCtxMenu();
  document.getElementById("pathSheet").classList.remove("show");
  document.getElementById("filterSheet").classList.remove("show");
  document.getElementById("menuBackdrop").classList.remove("show");
}
function openMenu(target, anchor) {
  menuTarget = target;
  const menu = document.getElementById("ctxMenu");
  menu.classList.add("show");                       // show first to measure it
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
  let top = r.bottom + 4;
  if (top + mh > window.innerHeight - 8) top = r.top - mh - 4;   // flip up if no room below
  menu.style.left = left + "px";
  menu.style.top = Math.max(8, top) + "px";
}
function openPathSheet() {
  if (!menuTarget) return;
  closeCtxMenu();
  document.getElementById("pathTitle").textContent =
    menuTarget.type === "folder" ? "Rename folder path" : "Change note path";
  document.getElementById("pathInput").value = menuTarget.path || "";

  document.getElementById("menuBackdrop").classList.add("show");

}
async function apiPost(path, body) {
  const base = window.__API_BASE__;
  if (!base) return { ok: false, status: 0 };
  try {
    return await fetch(base.replace(/\/$/, "") + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": INIT_DATA },
      body: JSON.stringify(body),
    });

async function savePath() {
  if (!menuTarget) return;
  const val = (document.getElementById("pathInput").value || "").trim();
  const err = document.getElementById("pathError");
  if (!val) { err.textContent = "Enter a path."; return; }
  const res = menuTarget.type === "note"
    ? await apiPost("/webapp/notes/" + encodeURIComponent(menuTarget.id) + "/path", { path: val })
    : await apiPost("/webapp/folder/move", { old_path: menuTarget.path, new_path: val });
  if (!res || !res.ok) {
    err.textContent = (res && res.status === 422)
      ? "Path must start with a root folder." : "Couldn't save. Try again.";
    return;
  }
  hideActionSheets();
  await reloadNotes();   // refresh notes + regroup the tree with the new path
  tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred && tg.HapticFeedback.notificationOccurred("success");
}
document.getElementById("menuBackdrop").addEventListener("click", hideActionSheets);
document.getElementById("menuChangePath").addEventListener("click", openPathSheet);
document.getElementById("pathCancel").addEventListener("click", hideActionSheets);
document.getElementById("pathSave").addEventListener("click", savePath);

// Dismiss the context menu on any outside click or when the tree scrolls.
document.addEventListener("click", (e) => {
  const menu = document.getElementById("ctxMenu");
  if (menu.classList.contains("show") && !menu.contains(e.target)) closeCtxMenu();
});
document.querySelector("main").addEventListener("scroll", closeCtxMenu, true);

/* ------- Connections map (canvas force-directed graph) ------- */
const GRAPH = { canvas: null, ctx: null, dpr: 1, sim: null, raf: null,
  running: false, loaded: false, selected: null, ego: null, focusReq: 0,
  view: { scale: 1, tx: 0, ty: 0 } };

function rootFolder(path) { const s = (path || "Inbox").split("/")[0].trim(); return s || "Inbox"; }
function folderColor(name) {
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return "hsl(" + (h % 360) + ",55%,62%)";
}
function truncateLabel(ctx, s, maxW) {
  s = String(s || "");
  if (ctx.measureText(s).width <= maxW) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ctx.measureText(s.slice(0, mid) + "…").width <= maxW) lo = mid; else hi = mid - 1; }
  return s.slice(0, lo) + "…";
}
function nodeRadius(n) { return 4 + Math.min(11, (n.degree || 0) * 1.6); }

function DEMO_GRAPH() {
  const byFolder = {};
  for (const n of SAMPLE_NOTES) (byFolder[n.path] = byFolder[n.path] || []).push(n.id);
  const edges = [];
  for (const k in byFolder) { const ids = byFolder[k]; for (let i = 1; i < ids.length; i++) edges.push({ source: ids[i - 1], target: ids[i] }); }
  edges.push({ source: 1, target: 9 }, { source: 9, target: 11 });
  const deg = {}; edges.forEach(e => { deg[e.source] = (deg[e.source] || 0) + 1; deg[e.target] = (deg[e.target] || 0) + 1; });
  const nodes = SAMPLE_NOTES.map(n => ({ id: n.id, title: n.title, path: n.path, degree: deg[n.id] || 0 }))
    .filter(n => n.degree > 0);
  return { nodes, edges };
}

async function fetchGraph() {
  const base = window.__API_BASE__;
  if (!base) return DEMO_GRAPH();
  try {
    const res = await fetch(base.replace(/\/$/, "") + "/webapp/graph", { headers: { "X-Telegram-Init-Data": INIT_DATA } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (e) { console.warn("Graph API unavailable:", e); return DEMO_GRAPH(); }
}

function buildSim(data, W, H) {
  const spread = Math.min(W, H) * 0.5 || 200;
  const nodes = data.nodes.map(n => ({ ...n, x: (Math.random() - .5) * spread, y: (Math.random() - .5) * spread, vx: 0, vy: 0 }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const edges = (data.edges || []).map(e => ({ a: byId.get(e.source), b: byId.get(e.target) })).filter(e => e.a && e.b);
  return { nodes, edges, alpha: 1 };
}

function stepSim(sim) {
  const nodes = sim.nodes, a = sim.alpha;
  const REPEL = 1600, SPRING = 0.02, LEN = 64, CENTER = 0.015, DAMP = 0.85;
  for (let i = 0; i < nodes.length; i++) {
    const ni = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const nj = nodes[j];
      let dx = ni.x - nj.x, dy = ni.y - nj.y, d2 = dx * dx + dy * dy;
      if (d2 < 0.01) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = dx * dx + dy * dy + 0.01; }
      const inv = 1 / Math.sqrt(d2), f = REPEL / d2, fx = dx * inv * f, fy = dy * inv * f;
      ni.vx += fx; ni.vy += fy; nj.vx -= fx; nj.vy -= fy;
    }
  }
  for (const e of sim.edges) {
    let dx = e.b.x - e.a.x, dy = e.b.y - e.a.y; const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const f = (d - LEN) * SPRING, fx = dx / d * f, fy = dy / d * f;
    e.a.vx += fx; e.a.vy += fy; e.b.vx -= fx; e.b.vy -= fy;
  }
  for (const n of nodes) {
    n.vx += -n.x * CENTER; n.vy += -n.y * CENTER;
    n.x += n.vx * a; n.y += n.vy * a;
    n.vx *= DAMP; n.vy *= DAMP;
  }
  sim.alpha = Math.max(0.03, a * 0.985);
}

function sizeCanvas() {
  const c = GRAPH.canvas; if (!c) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2); GRAPH.dpr = dpr;
  c.width = Math.round(c.clientWidth * dpr); c.height = Math.round(c.clientHeight * dpr);
}

function autoFit() {
  const { sim, canvas, view } = GRAPH; if (!sim || !sim.nodes.length) return;
  let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
  for (const n of sim.nodes) { a = Math.min(a, n.x); c = Math.max(c, n.x); b = Math.min(b, n.y); d = Math.max(d, n.y); }
  const w = canvas.clientWidth, h = canvas.clientHeight, gw = Math.max(1, c - a), gh = Math.max(1, d - b);
  view.scale = Math.min(w / (gw + 120), h / (gh + 120), 2);
  view.tx = w / 2 - (a + c) / 2 * view.scale;
  view.ty = h / 2 - (b + d) / 2 * view.scale;
}

function drawGraph() {
  const { ctx, canvas, sim, view, dpr, selected } = GRAPH; if (!ctx || !sim) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(view.tx, view.ty); ctx.scale(view.scale, view.scale);
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1 / view.scale;
  ctx.beginPath();
  for (const e of sim.edges) { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
  ctx.stroke();
  for (const n of sim.nodes) {
    ctx.beginPath(); ctx.arc(n.x, n.y, nodeRadius(n), 0, Math.PI * 2);
    ctx.fillStyle = folderColor(rootFolder(n.path)); ctx.fill();
    if (selected === n.id) { ctx.lineWidth = 2 / view.scale; ctx.strokeStyle = "#fff"; ctx.stroke(); }
  }
  ctx.restore();
  drawLabels();
}

function drawLabels() {
  const { ctx, sim, view, selected } = GRAPH;
  ctx.font = "11px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.textBaseline = "top";
  // Semantic zoom: reveal more labels the closer you zoom in.
  const s = view.scale;
  let minDeg = s >= 2.2 ? 0 : s >= 1.3 ? 1 : s >= 0.7 ? 2 : 3;
  if (GRAPH.ego != null || sim.nodes.length <= 14) minDeg = 0;   // small/ego graphs: label all
  const placed = [];
  let count = 0;
  for (const n of [...sim.nodes].sort((x, y) => (y.degree || 0) - (x.degree || 0))) {
    if (count >= 36) break;
    const isSel = selected === n.id;
    if (!isSel && (n.degree || 0) < minDeg) continue;
    const sx = n.x * view.scale + view.tx, sy = n.y * view.scale + view.ty;
    const label = truncateLabel(ctx, n.title, 120), tw = ctx.measureText(label).width;
    const bx = sx - tw / 2, by = sy + nodeRadius(n) * view.scale + 2, bw = tw, bh = 13;
    if (!isSel && placed.some(p => bx < p.x + p.w && bx + bw > p.x && by < p.y + p.h && by + bh > p.y)) continue;
    placed.push({ x: bx, y: by, w: bw, h: bh });
    ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(bx - 3, by - 1, bw + 6, bh + 2);
    ctx.fillStyle = isSel ? "#fff" : "rgba(230,230,230,.92)"; ctx.fillText(label, bx, by);
    count++;
  }
}

function graphEmptyMessage(msg) {
  const { ctx, canvas, dpr } = GRAPH;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  ctx.fillStyle = "rgba(150,150,150,.85)"; ctx.font = "13px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(msg, canvas.clientWidth / 2, canvas.clientHeight / 2); ctx.textAlign = "start";
}

function graphLoop() {
  if (!GRAPH.running) return;
  stepSim(GRAPH.sim); drawGraph();
  GRAPH.raf = requestAnimationFrame(graphLoop);
}
function startGraphLoop() { if (GRAPH.running || !GRAPH.sim) return; GRAPH.running = true; GRAPH.raf = requestAnimationFrame(graphLoop); }
function stopGraphLoop() { GRAPH.running = false; if (GRAPH.raf) cancelAnimationFrame(GRAPH.raf); GRAPH.raf = null; }

function zoomAt(cx, cy, factor) {
  const v = GRAPH.view, gx = (cx - v.tx) / v.scale, gy = (cy - v.ty) / v.scale;
  v.scale = Math.max(0.2, Math.min(4, v.scale * factor));
  v.tx = cx - gx * v.scale; v.ty = cy - gy * v.scale;
}
function graphTap(clientX, clientY) {
  const c = GRAPH.canvas, rect = c.getBoundingClientRect(), v = GRAPH.view;
  const gx = (clientX - rect.left - v.tx) / v.scale, gy = (clientY - rect.top - v.ty) / v.scale;
  let best = null, bestd = 1e9;
  for (const n of (GRAPH.sim ? GRAPH.sim.nodes : [])) {
    const r = nodeRadius(n) + 8, dx = n.x - gx, dy = n.y - gy, d = dx * dx + dy * dy;
    if (d < r * r && d < bestd) { best = n; bestd = d; }
  }
  if (best) focusNode(best); else clearFocus();
}

/* ------- Focused node card → neighbors (ego) / full note / outline ------- */
function neighborCount(id) {
  const edges = (GRAPH.data && GRAPH.data.edges) || [];
  let n = 0;
  for (const e of edges) if (e.source === id || e.target === id) n++;
  return n;
}
function centerOnNode(node) {
  const c = GRAPH.canvas, v = GRAPH.view;
  if (!c) return;
  v.tx = c.clientWidth / 2 - node.x * v.scale;
  v.ty = c.clientHeight / 2 - node.y * v.scale;
}
function focusNode(node) {
  GRAPH.selected = node.id;
  GRAPH.focusNodeId = node.id;
  centerOnNode(node);
  document.getElementById("focusTitle").textContent = node.title || "untitled";
  document.getElementById("focusPath").textContent = "📁 " + (node.path || "Inbox");
  document.getElementById("focusMeta").textContent = neighborCount(node.id) + " linked note(s)";
  document.getElementById("focusCard").classList.remove("hidden");
  tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
  // Enrich the card with tags / a snippet once the note detail loads.
  const req = ++GRAPH.focusReq;
  fetchNote(node.id).then((d) => {
    if (req !== GRAPH.focusReq || !d) return;
    const bits = [];
    if (d.tags && d.tags.length) bits.push("🏷 " + d.tags.join(", "));
    const snip = (d.text || "").trim().replace(/\s+/g, " ");
    if (snip) bits.push(snip.slice(0, 80) + (snip.length > 80 ? "…" : ""));
    if (bits.length) document.getElementById("focusMeta").textContent = bits.join("  ·  ");
  });
}
function clearFocus() {
  GRAPH.selected = null; GRAPH.focusNodeId = null; GRAPH.focusReq++;
  document.getElementById("focusCard").classList.add("hidden");
}
function enterEgo() {
  if (GRAPH.focusNodeId == null) return;
  GRAPH.ego = GRAPH.focusNodeId;
  rebuildGraphSim();
  document.getElementById("egoReset").classList.remove("hidden");
}
function exitEgo() {
  if (GRAPH.ego == null) { document.getElementById("egoReset").classList.add("hidden"); return; }
  GRAPH.ego = null;
  document.getElementById("egoReset").classList.add("hidden");
  rebuildGraphSim();
}
function outlineToNote(noteId) {
  activateView("browser");
  requestAnimationFrame(() => {
    const row = document.querySelector('#tree [data-id="' + noteId + '"]');
    if (!row) return;
    let p = row.parentElement;
    while (p && p.id !== "tree") { if (p.classList.contains("folder")) p.classList.add("open"); p = p.parentElement; }
    row.scrollIntoView({ block: "center", behavior: "smooth" });
    row.classList.add("flash");
    setTimeout(() => row.classList.remove("flash"), 1500);
  });
}
document.getElementById("focusClose").addEventListener("click", clearFocus);
document.getElementById("focusNeighbors").addEventListener("click", enterEgo);
document.getElementById("focusOpen").addEventListener("click", () => {
  if (GRAPH.focusNodeId != null) openCard({ id: GRAPH.focusNodeId, title: document.getElementById("focusTitle").textContent }, null);
});
document.getElementById("focusOutline").addEventListener("click", () => {
  if (GRAPH.focusNodeId != null) outlineToNote(GRAPH.focusNodeId);
});
document.getElementById("egoReset").addEventListener("click", exitEgo);
function setupGraphInput() {
  const c = GRAPH.canvas; if (!c || c._wired) return; c._wired = true;
  const pointers = new Map(); let last = null, moved = 0, pinch = 0;
  c.addEventListener("pointerdown", (e) => {
    c.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    last = { x: e.clientX, y: e.clientY }; moved = 0;
    if (pointers.size === 2) { const p = [...pointers.values()]; pinch = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); }
  });
  c.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const p = [...pointers.values()], d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      if (pinch > 0) { const rect = c.getBoundingClientRect(); zoomAt((p[0].x + p[1].x) / 2 - rect.left, (p[0].y + p[1].y) / 2 - rect.top, d / pinch); }
      pinch = d; moved = 999; return;
    }
    if (last) { const dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy); GRAPH.view.tx += dx; GRAPH.view.ty += dy; last = { x: e.clientX, y: e.clientY }; }
  });
  const up = (e) => {
    if (!pointers.has(e.pointerId)) return;
    if (pointers.size === 1 && moved < 6) graphTap(e.clientX, e.clientY);
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = 0;
    last = pointers.size === 1 ? [...pointers.values()][0] : null;
  };
  c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
  c.addEventListener("wheel", (e) => { e.preventDefault(); const rect = c.getBoundingClientRect(); zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.1 : 0.9); }, { passive: false });
}

// The Map shares the Notes folder filter: keep only nodes whose note is in a
// selected folder, and edges whose both endpoints survive.
function graphFilterSig() {
  return (filterSel ? [...filterSel].sort().join("|") : "ALL") + "|ego:" + (GRAPH.ego == null ? "" : GRAPH.ego);
}
function applyGraphFilter(data) {
  if (!filterSel) return data;
  const nodes = (data.nodes || []).filter((n) => filterSel.has(n.path || "(unsorted)"));
  const ids = new Set(nodes.map((n) => n.id));
  const edges = (data.edges || []).filter((e) => ids.has(e.source) && ids.has(e.target));
  return { nodes, edges };
}
// The data currently displayed: the folder-filtered graph, narrowed to a depth-1
// ego subgraph (focused node + its neighbours) when ego mode is on.
function currentGraphData() {
  const full = applyGraphFilter(GRAPH.data || { nodes: [], edges: [] });
  if (GRAPH.ego == null) return full;
  const keep = new Set([GRAPH.ego]);
  for (const e of full.edges) {
    if (e.source === GRAPH.ego) keep.add(e.target);
    if (e.target === GRAPH.ego) keep.add(e.source);
  }
  return {
    nodes: full.nodes.filter((n) => keep.has(n.id)),
    edges: full.edges.filter((e) => keep.has(e.source) && keep.has(e.target)),
  };
}
function rebuildGraphSim() {
  GRAPH.filterSig = graphFilterSig();
  const data = currentGraphData();
  if (!data.nodes.length) {
    stopGraphLoop(); GRAPH.sim = null;
    graphEmptyMessage(filterSel ? "No notes match the folder filter."
                                : "No connections yet — link notes in the bot.");
    return;
  }
  GRAPH.sim = buildSim(data, GRAPH.canvas.clientWidth, GRAPH.canvas.clientHeight);
  for (let i = 0; i < 80; i++) stepSim(GRAPH.sim);   // warm up before first paint
  autoFit();
  startGraphLoop();
}

async function ensureGraph() {
  GRAPH.canvas = document.getElementById("graph");
  GRAPH.ctx = GRAPH.canvas.getContext("2d");
  sizeCanvas();
  setupGraphInput();
  if (!GRAPH.loaded) { GRAPH.loaded = true; GRAPH.data = await fetchGraph(); }
  // Rebuild if never built or the folder filter changed since the last build.
  if (!GRAPH.sim || GRAPH.filterSig !== graphFilterSig()) rebuildGraphSim();
  else startGraphLoop();
}

window.addEventListener("resize", () => {
  if (document.getElementById("map").classList.contains("hidden")) return;
  sizeCanvas(); autoFit();
});

/* ------- Views + floating dock (Notes | Browser | Map · Chat / Search) ------- */
let ALL_NOTES = [];   // newest-first, from /webapp/notes (browser tree + search)
let FEED = null;      // full note details for the post feed, lazy-loaded once
let prevView = "notes";   // last non-input view we return to on close
let barMode = null;       // 'search' | 'chat' while the pill shows its input
let filterSel = null;     // Set of included folder keys, or null = show all
let FILTER_KEYS = [];     // all distinct folder keys, computed when the sheet opens

// A note's folder key for the filter (its path, or a bucket for unsorted notes).
function notePathKey(d) { return d.path || "(unsorted)"; }

const SEARCH_ICON = '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>';
const CHAT_ICON = '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9A1.5 1.5 0 0 1 18.5 16H9l-4 3.5V16H5.5A1.5 1.5 0 0 1 4 14.5v-9Z"/>';

async function reloadNotes() {
  ALL_NOTES = await fetchNotes();
  FEED = null;                 // invalidate the cached feed so it reloads
  renderTree(ALL_NOTES);
  await renderNotesFeed();
}

function activateView(view) {
  const isInput = (view === "search" || view === "chat");
  if (!isInput) prevView = view;
  barMode = isInput ? view : null;

  document.getElementById("notes").classList.toggle("hidden", view !== "notes");
  document.getElementById("tree").classList.toggle("hidden", view !== "browser");
  document.getElementById("map").classList.toggle("hidden", view !== "map");
  document.getElementById("search").classList.toggle("hidden", view !== "search");
  document.getElementById("chat").classList.toggle("hidden", view !== "chat");

  // pill shows nav icons, or the shared input when in search/chat mode
  document.getElementById("tabIcons").classList.toggle("hidden", isInput);
  document.getElementById("tabInput").classList.toggle("hidden", !isInput);
  document.getElementById("dock").classList.toggle("input", isInput);   // widen the pill
  document.querySelectorAll("#tabIcons .tab").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
  // The two circles: the active one stays (and doubles as the close/back button),
  // the opposite one is hidden while an input mode is open.
  document.getElementById("chatFab").classList.toggle("active", view === "chat");
  document.getElementById("searchFab").classList.toggle("active", view === "search");
  document.getElementById("chatFab").classList.toggle("hidden", view === "search");
  document.getElementById("searchFab").classList.toggle("hidden", view === "chat");
  // The folder filter applies to the Notes feed and the Map (links) graph.
  document.getElementById("filterBtn").classList.toggle("hidden", view !== "notes" && view !== "map");

  if (isInput) {
    const input = document.getElementById("barInput");
    input.value = "";
    input.placeholder = view === "chat" ? "Ask about your notes…" : "Search notes…";
    document.getElementById("barIcon").innerHTML = view === "chat" ? CHAT_ICON : SEARCH_ICON;
    setTimeout(() => input.focus(), 60);
    if (view === "chat") renderChat();
  }

  if (view === "map") { ensureGraph(); }
  else { stopGraphLoop(); clearFocus(); if (GRAPH.ego != null) { GRAPH.ego = null; document.getElementById("egoReset").classList.add("hidden"); } }
  if (view === "notes") renderNotesFeed();   // async; fire-and-forget
  tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
}
document.querySelectorAll("#tabIcons .tab").forEach((btn) => {
  btn.addEventListener("click", () => activateView(btn.dataset.view));
});
// Tapping a circle opens its mode; tapping it again (while active) closes back to
// the last view — so the visible circle doubles as the close button, outside the
// input bar.
function toggleMode(mode) {
  if (barMode === mode) {
    document.getElementById("barInput").value = "";
    document.getElementById("searchResults").innerHTML = "";
    activateView(prevView);
  } else {
    activateView(mode);
  }
}
document.getElementById("chatFab").addEventListener("click", () => toggleMode("chat"));
document.getElementById("searchFab").addEventListener("click", () => toggleMode("search"));

/* ------- Notes feed (full previews as Instagram-style posts, newest first) ------- */
let feedReq = 0;   // guards against a stale feed fetch landing after a newer render
async function renderNotesFeed() {
  const mount = document.getElementById("notes");
  if (FEED === null) {
    mount.innerHTML = '<div class="empty">Loading…</div>';
    const req = ++feedReq;
    const data = await fetchFeed();
    if (req !== feedReq) return;   // a newer render started meanwhile
    FEED = data;
  }
  mount.innerHTML = "";
  if (!FEED.length) {
    mount.innerHTML = '<div class="empty">No notes yet.<br>Send one to the bot to get started.</div>';
    return;
  }
  const items = filterSel ? FEED.filter((d) => filterSel.has(notePathKey(d))) : FEED;
  if (!items.length) {
    mount.innerHTML = '<div class="empty">No notes match the folder filter.</div>';
    return;
  }
  for (const d of items) mount.appendChild(buildPost(d));
}

/* ------- Folder filter (feed) — indented tri-state checkbox tree ------- */
// Keys under a folder node: the node's own path plus anything nested beneath it.
function descendantKeys(path) {
  return FILTER_KEYS.filter((k) => k === path || k.startsWith(path + "/"));
}
function noteCountUnder(path) {
  return FEED.filter((d) => { const k = notePathKey(d); return k === path || k.startsWith(path + "/"); }).length;
}

function renderFilterTree() {
  const mount = document.getElementById("filterTree");
  mount.innerHTML = "";
  if (!FILTER_KEYS.length) { mount.innerHTML = '<div class="empty">No folders yet.</div>'; return; }
  const sel = filterSel || new Set(FILTER_KEYS);

  // Build a nested folder tree from the flat keys.
  const root = { children: new Map() };
  for (const key of FILTER_KEYS) {
    let node = root, acc = "";
    for (const seg of key.split("/")) {
      acc = acc ? acc + "/" + seg : seg;
      if (!node.children.has(seg)) node.children.set(seg, { name: seg, path: acc, children: new Map() });
      node = node.children.get(seg);
    }
  }

  (function walk(node, depth) {
    for (const child of [...node.children.values()].sort((a, b) => a.name.localeCompare(b.name))) {
      const dkeys = descendantKeys(child.path);
      const selN = dkeys.filter((k) => sel.has(k)).length;
      const row = document.createElement("label");
      row.className = "filter-row";
      row.style.paddingLeft = (4 + depth * 18) + "px";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = selN === dkeys.length;
      cb.indeterminate = selN > 0 && selN < dkeys.length;   // partial = square/dash
      cb.addEventListener("change", () => toggleFilterNode(dkeys, cb.checked));
      const name = document.createElement("span");
      name.className = "filter-name"; name.textContent = child.name;
      const count = document.createElement("span");
      count.className = "filter-count"; count.textContent = noteCountUnder(child.path);
      row.appendChild(cb); row.appendChild(name); row.appendChild(count);
      mount.appendChild(row);
      walk(child, depth + 1);
    }
  })(root, 0);
}

function toggleFilterNode(dkeys, checked) {
  if (!filterSel) filterSel = new Set(FILTER_KEYS);   // materialize "all" before narrowing
  if (checked) dkeys.forEach((k) => filterSel.add(k));
  else dkeys.forEach((k) => filterSel.delete(k));
  if (filterSel.size >= FILTER_KEYS.length) filterSel = null;   // everything = no filter
  persistFilter();
  renderFilterTree();
  refreshFilteredViews();
  updateFilterBtn();
}

function updateFilterBtn() {
  document.getElementById("filterBtn").classList.toggle("active", !!filterSel);
}

// Re-apply the filter to whichever note view is showing: always the feed, and
// the Map graph too when it's the active tab (rebuilds only if the filter moved).
function refreshFilteredViews() {
  renderNotesFeed();
  if (!document.getElementById("map").classList.contains("hidden")) ensureGraph();
}

// The selection persists (across tab switches and app reopens) so the chosen
// folders remain the same. Stored per-viewer; failures degrade to in-memory only.
const FILTER_STORE_KEY = "feedFolderFilter";
function persistFilter() {
  try {
    if (filterSel) localStorage.setItem(FILTER_STORE_KEY, JSON.stringify([...filterSel]));
    else localStorage.removeItem(FILTER_STORE_KEY);
  } catch (e) { /* storage unavailable — keep in memory only */ }
}
function loadFilter() {
  try {
    const raw = localStorage.getItem(FILTER_STORE_KEY);
    filterSel = raw ? new Set(JSON.parse(raw)) : null;
  } catch (e) { filterSel = null; }
}

function openFilter() {
  if (FEED === null) return;   // feed not loaded yet
  FILTER_KEYS = [...new Set(FEED.map(notePathKey))].filter(Boolean).sort();
  renderFilterTree();
  document.getElementById("filterSheet").classList.add("show");
  document.getElementById("menuBackdrop").classList.add("show");
}
document.getElementById("filterBtn").addEventListener("click", openFilter);
document.getElementById("filterDone").addEventListener("click", hideActionSheets);
document.getElementById("filterAll").addEventListener("click", () => {
  filterSel = null; persistFilter(); renderFilterTree(); refreshFilteredViews(); updateFilterBtn();
});
document.getElementById("filterNone").addEventListener("click", () => {
  filterSel = new Set(); persistFilter(); renderFilterTree(); refreshFilteredViews(); updateFilterBtn();
});

/* ------- Search (client-side over loaded notes) ------- */
function runSearch(q) {
  q = (q || "").trim().toLowerCase();
  const out = document.getElementById("searchResults");
  out.innerHTML = "";
  if (!q) return;
  const hits = ALL_NOTES.filter(n =>
    ((n.title || "") + " " + (n.path || "")).toLowerCase().includes(q)).slice(0, 50);
  if (!hits.length) { out.innerHTML = '<div class="empty">No matches.</div>'; return; }
  for (const n of hits) out.appendChild(renderFile(n));
}

// The pill input is shared: typing filters notes in search mode; Enter sends a
// message in chat mode.
document.getElementById("barInput").addEventListener("input", (e) => {
  if (barMode === "search") runSearch(e.target.value);
});
document.getElementById("barInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && barMode === "chat") { e.preventDefault(); sendChat(e.target.value); }
});
document.getElementById("barSend").addEventListener("click", () => {
  const v = document.getElementById("barInput").value;
  if (barMode === "chat") sendChat(v); else runSearch(v);
});

/* ------- Chat (talk to the assistant about your notes) ------- */
// Conversation is in-memory for the session. The reply comes from the chat
// backend seam (fetchChatReply); until the agent endpoint exists it degrades to
// a friendly "not connected yet" note.
const CHAT = [];   // [{ role: 'user' | 'bot', text, pending?, muted? }]
let chatBusy = false;

function renderChat() {
  const log = document.getElementById("chatLog");
  log.innerHTML = "";
  if (!CHAT.length) {
    log.innerHTML = '<div class="chat-empty">Ask anything about your notes.<br>The assistant can search and summarize them.</div>';
    return;
  }
  for (const m of CHAT) {
    const el = document.createElement("div");
    el.className = "msg " + (m.role === "user" ? "user" : "bot") + (m.muted ? " muted" : "");
    if (m.pending) el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    else el.textContent = m.text;
    log.appendChild(el);
  }
  const main = document.querySelector("main");
  requestAnimationFrame(() => { main.scrollTop = main.scrollHeight; });
}

async function sendChat(text) {
  text = (text || "").trim();
  if (!text || chatBusy) return;
  chatBusy = true;
  document.getElementById("barInput").value = "";
  CHAT.push({ role: "user", text });
  const thinking = { role: "bot", pending: true };
  CHAT.push(thinking);
  renderChat();

  const reply = await fetchChatReply(text);
  CHAT.splice(CHAT.indexOf(thinking), 1);
  CHAT.push(reply
    ? { role: "bot", text: reply }
    : { role: "bot", text: "The assistant isn't connected yet — coming soon.", muted: true });
  renderChat();
  chatBusy = false;
}

async function fetchChatReply(text) {
  const base = window.__API_BASE__;
  if (!base) return null;   // demo / no backend yet
  try {
    const res = await fetch(base.replace(/\/$/, "") + "/webapp/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": INIT_DATA },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    return data.reply || data.answer || null;
  } catch (e) {
    console.warn("Chat backend unavailable:", e);
    return null;
  }
}

/* ------- Utils ------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ------- Reminders header stat ------- */
async function refreshReminderCount() {
  const base = window.__API_BASE__;
  if (!base) return;   // demo: leave at 0
  try {
    const res = await fetch(base.replace(/\/$/, "") + "/webapp/reminders/count", {
      headers: { "X-Telegram-Init-Data": INIT_DATA },
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    document.getElementById("statReminders").textContent = data.count || 0;
  } catch (e) { console.warn("Reminder count unavailable:", e); }
}

/* ------- Boot ------- */
(async function () {
  loadFilter();            // restore the saved folder filter before first render
  updateFilterBtn();
  await reloadNotes();
  refreshReminderCount();
})();
</script>
