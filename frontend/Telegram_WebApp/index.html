<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Notes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:            #1e1e1e;   /* Obsidian dark primary */
    --bg-alt:        #191919;
    --bg-elev:       #262626;
    --border:        #333333;
    --text:          #dcddde;
    --text-muted:    #8a8a8e;
    --text-faint:    #6a6a6e;
    --accent:        #a482ff;   /* Obsidian violet */
    --accent-soft:   rgba(164,130,255,0.14);
    --hover:         rgba(255,255,255,0.05);
    --mono: "JetBrains Mono","SFMono-Regular",ui-monospace,"Cascadia Code",
            Consolas,"Liberation Mono",Menlo,monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 300;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  header {
    position: sticky; top: 0; z-index: 5;
    padding: 14px 16px 10px;
    background: var(--bg-alt);
    border-bottom: 1px solid var(--border);
  }
  .tabs { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .tab {
    flex: 1; padding: 7px 10px;
    background: transparent; border: none; border-radius: 6px;
    color: var(--text-muted); font-family: var(--mono); font-size: 13px; font-weight: 400;
    cursor: pointer; transition: background .12s ease, color .12s ease;
  }
  .tab.active { background: var(--accent-soft); color: var(--text); }

  .view.hidden { display: none; }

  main { flex: 1; overflow-y: auto; padding: 6px 8px 40px; }

  .row {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .row:hover { background: var(--hover); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .dots {
    flex: none; margin-left: 6px;
    padding: 0 5px; border-radius: 4px;
    color: var(--text-faint); font-size: 16px; line-height: 1;
    cursor: pointer;
  }
  .row .dots:hover { color: var(--text); background: var(--hover); }

  .folder > .row { position: relative; }
  /* Dashed line descending from under an open folder into its children. */
  .folder.open > .row::after {
    content: ""; position: absolute;
    left: 15px; top: calc(50% + 8px); bottom: 0;   /* start below the folder icon, centered under it */
    border-left: 1px dashed var(--border);
  }
  .folder .children { display: none; margin-left: 15px; padding-left: 4px; }
  .folder.open > .children { display: block; }

  /* Tree guides: a dashed vertical line per node + a dashed connector to it.
     The LAST node's vertical stops at the connector (└), not continuing past it. */
  .children > .file,
  .children > .folder,
  .children > .folder > .row { position: relative; }
  .children > .file::before,
  .children > .folder > .row::before {           /* horizontal connector */
    content: ""; position: absolute;
    left: -4px; top: 50%; width: 8px;
    border-top: 1px dashed var(--border);
  }
  .children > .file::after,
  .children > .folder::after {                    /* vertical guide */
    content: ""; position: absolute;
    left: -4px; top: 0; height: 100%;
    border-left: 1px dashed var(--border);
  }
  .children > .file:last-child::after,
  .children > .folder:last-child::after {
    height: 16px;                                 /* stop at the connector */
  }

  .file .name { color: var(--text); }
  .file .name .ext { color: var(--text-faint); }
  .file.active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .row.selected { background: var(--accent-soft); }

  footer.status {
    flex: none;
    padding: 7px 14px;
    background: var(--bg-alt);
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 12px;
    letter-spacing: .3px;
    white-space: nowrap;
  }
  footer.status b { color: var(--text); font-weight: 400; }
  footer.status .sep { color: var(--text-faint); margin: 0 8px; }

  .ico { flex: none; opacity: .85; }
  .folder > .row .ico { color: var(--text-muted); }
  .file .ico { color: var(--text-muted); }

  .empty { text-align: center; color: var(--text-faint); padding: 48px 20px; font-size: 13px; }

  /* Note card (stub for now) */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 20;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    padding: 14px 18px calc(26px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%);
    transition: transform .22s cubic-bezier(.2,.8,.2,1);
    max-height: 85%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 36px; height: 4px; border-radius: 3px; background: var(--border); margin: 0 auto 12px; }
  .sheet .card-title { font-size: 16px; font-weight: 400; word-break: break-word; }
  .sheet .card-path { margin-top: 4px; color: var(--accent); font-size: 12px; }
  .sheet .card-meta { margin-top: 6px; color: var(--text-faint); font-size: 12px; }
  .sheet .card-body { margin-top: 14px; color: var(--text-muted); font-size: 13px; line-height: 1.5; border-top: 1px dashed var(--border); padding-top: 12px; white-space: pre-wrap; word-break: break-word; }
  .sheet .card-body.muted { color: var(--text-faint); font-style: italic; }
  .sheet .card-links { margin-top: 14px; }
  .sheet .card-links:empty { display: none; }
  .sheet .links-label { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 6px; }
  .sheet .links-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .sheet .link-chip { display: inline-flex; align-items: center; max-width: 100%; padding: 5px 10px; font: inherit; font-size: 12px; color: var(--text); background: var(--bg-elev, #262626); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet .link-chip:active { background: var(--border); }
  /* ⋮ context menu (dropdown at the dots) + change-path input */
  .ctx-menu { position: fixed; z-index: 30; min-width: 150px; padding: 4px; background: var(--bg-elev, #262626); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.45); display: none; }
  .ctx-menu.show { display: block; }
  .ctx-item { display: block; width: 100%; text-align: left; font: inherit; font-size: 14px; color: var(--text); background: transparent; border: none; border-radius: 6px; padding: 9px 12px; cursor: pointer; }
  .ctx-item:active { background: var(--border); }
  #pathSheet .path-input { margin-top: 14px; width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; color: var(--text); background: var(--bg, #1e1e1e); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
  #pathSheet .path-input:focus { outline: none; border-color: var(--accent); }
  #pathSheet .path-error { min-height: 16px; margin-top: 6px; color: #e5736b; font-size: 12px; }
  #pathSheet .path-actions { margin-top: 8px; display: flex; gap: 8px; justify-content: flex-end; }
  #pathSheet .path-btn { font: inherit; font-size: 14px; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--border); }
  #pathSheet .path-btn.ghost { background: transparent; color: var(--text-muted); }
  #pathSheet .path-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  /* Connections map */
  #map { padding: 0; position: relative; }
  #graph { display: block; width: 100%; height: calc(100vh - 120px); touch-action: none; }
  .map-hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: var(--text-faint); font-size: 11px; pointer-events: none; }
</style>
</head>
<body>
  <header>
    <div class="tabs">
      <button class="tab active" data-view="browser">Browser</button>
      <button class="tab" data-view="map">Map</button>
    </div>
  </header>

  <main>
    <div id="tree" class="view"></div>
    <div id="map" class="view hidden">
      <canvas id="graph"></canvas>
      <div class="map-hint">tap a node to open · drag to pan · pinch / scroll to zoom</div>
    </div>
  </main>

  <footer class="status" id="status"></footer>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <div class="card-title" id="cardTitle"></div>
    <div class="card-path" id="cardPath"></div>
    <div class="card-meta" id="cardMeta"></div>
    <div class="card-body" id="cardBody"></div>
    <div class="card-links" id="cardLinks"></div>
  </div>

  <div class="sheet-backdrop" id="menuBackdrop"></div>
  <div class="ctx-menu" id="ctxMenu">
    <button class="ctx-item" id="menuChangePath">📁 Change path</button>
  </div>

  <div class="sheet" id="pathSheet">
    <div class="grip"></div>
    <div class="card-title" id="pathTitle">Change path</div>
    <input class="path-input" id="pathInput" type="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="Projects/idea" />
    <div class="path-error" id="pathError"></div>
    <div class="path-actions">
      <button class="path-btn ghost" id="pathCancel">Cancel</button>
      <button class="path-btn primary" id="pathSave">Save</button>
    </div>
  </div>

<script>
"use strict";

/* ------- Telegram Mini App integration (no-op in a plain browser) ------- */
const tg = window.Telegram && window.Telegram.WebApp;
let INIT_DATA = "";
if (tg) {
  try {
    tg.ready();
    tg.expand();
    tg.setHeaderColor && tg.setHeaderColor("#191919");
    tg.setBackgroundColor && tg.setBackgroundColor("#1e1e1e");
    INIT_DATA = tg.initData || "";
  } catch (e) { /* ignore */ }
}

/* ------- Data source -------
   Swap point for the real backend. When the API is publicly reachable, set
   window.__API_BASE__ (e.g. the deployed API URL) and this will call
   GET {API_BASE}/webapp/notes with the Telegram initData for auth, expecting
   [{ id, title, path }]. Until then it falls back to SAMPLE_NOTES so the UI
   renders on its own. */
// Served from the API's own domain, so same-origin works; the explicit https
// URL is a fallback. (A bare host with no scheme would be treated as a relative
// path and fail — always include https://.)
window.__API_BASE__ = window.__API_BASE__
  || location.origin
  || "https://scintillating-celebration-production-69b8.up.railway.app";

const SAMPLE_NOTES = [
  { id: 1,  title: "Refactor bot to call API", path: "Projects/daily-notes", links: 3 },
  { id: 2,  title: "Atomize multi-idea dumps", path: "Projects/daily-notes", links: 2 },
  { id: 3,  title: "Google Calendar integration idea", path: "Projects/daily-notes", links: 1 },
  { id: 4,  title: "Ship the note-browser mini app", path: "Projects/webapp", links: 2 },
  { id: 5,  title: "Mindmap graph view (later)", path: "Projects/webapp", links: 0 },
  { id: 6,  title: "Morning stretch routine", path: "Areas/health", links: 1 },
  { id: 7,  title: "Sleep before midnight", path: "Areas/health", links: 0 },
  { id: 8,  title: "Quarterly budget review", path: "Areas/finance", links: 0 },
  { id: 9,  title: "PARA method overview", path: "Resources/productivity", links: 4 },
  { id: 10, title: "Zettelkasten linking notes", path: "Resources/productivity", links: 4 },
  { id: 11, title: "pgvector cheatsheet", path: "Resources/postgres", links: 1 },
  { id: 12, title: "Old side project postmortem", path: "Archive", links: 0 },
  { id: 13, title: "Random thought about coffee", path: "Inbox", links: 0 },
  { id: 14, title: "Call the dentist", path: "Inbox", links: 0 },
];

async function fetchNotes() {
  const base = window.__API_BASE__;
  if (!base) return SAMPLE_NOTES;
  try {
    const res = await fetch(base.replace(/\/$/, "") + "/webapp/notes", {
      headers: { "X-Telegram-Init-Data": INIT_DATA },
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    return Array.isArray(data) ? data : (data.notes || []);
  } catch (e) {
    console.warn("Notes API unavailable, using sample data:", e);
    return SAMPLE_NOTES;
  }
}

/* ------- Tree building ------- */
function buildTree(notes) {
  const root = { folders: {}, files: [] };
  for (const n of notes) {
    const path = (n.path || "Inbox").trim() || "Inbox";
    const parts = path.split("/").map(p => p.trim()).filter(Boolean);
    let node = root;
    for (const part of parts) {
      node.folders[part] = node.folders[part] || { folders: {}, files: [] };
      node = node.folders[part];
    }
    node.files.push(n);
  }
  return root;
}

function countNotes(node) {
  let c = node.files.length;
  for (const k in node.folders) c += countNotes(node.folders[k]);
  return c;
}

function countLinks(node) {
  let c = 0;
  for (const f of node.files) c += (f.links || 0);
  for (const k in node.folders) c += countLinks(node.folders[k]);
  return c;
}

/* ------- Status bar (scoped to the selected folder) ------- */
let selectedRow = null;
function setStatus(folder, notes, links) {
  // Show only the selected folder's own name, not the full breadcrumb path.
  const name = String(folder).split("/").pop() || folder;
  document.getElementById("status").innerHTML =
    "folder: <b>" + escapeHtml(name) + "</b><span class=\"sep\">|</span>" +
    "notes: <b>" + notes + "</b><span class=\"sep\">|</span>links: <b>" + links + "</b>";
}
function selectFolder(node, rowEl, path) {
  if (selectedRow) selectedRow.classList.remove("selected");
  if (rowEl) { rowEl.classList.add("selected"); selectedRow = rowEl; }
  setStatus(path, countNotes(node), countLinks(node));
}

/* ------- Icons ------- */
const folderSvg =
  '<svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>';
const fileSvg =
  '<svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h8l4 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v5h5"/><line x1="8" y1="12" x2="14" y2="12"/><line x1="8" y1="15.5" x2="14" y2="15.5"/><line x1="8" y1="19" x2="11.5" y2="19"/></svg>';

/* ------- Rendering ------- */
function renderFolder(name, node, forceOpen, path) {
  const el = document.createElement("div");
  el.className = "folder" + (forceOpen ? " open" : "");
  const header = document.createElement("div");
  header.className = "row";
  // Root folders (no "/" in their path) aren't renameable — no ⋮ menu for them.
  const isRoot = path.indexOf("/") < 0;
  header.innerHTML =
    folderSvg +
    '<span class="name">' + escapeHtml(name) + '</span>' +
    (isRoot ? "" : '<span class="dots" role="button" aria-label="menu">⋮</span>');
  const dotsEl = header.querySelector(".dots");
  if (dotsEl) dotsEl.addEventListener("click", (e) => {
    e.stopPropagation();
    openMenu({ type: "folder", path, name }, e.currentTarget);
  });
  const children = document.createElement("div");
  children.className = "children";

  const folderNames = Object.keys(node.folders).sort((a, b) => a.localeCompare(b));
  for (const f of folderNames) children.appendChild(renderFolder(f, node.folders[f], forceOpen, path + "/" + f));
  const files = node.files.slice().sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  for (const file of files) children.appendChild(renderFile(file));

  header.addEventListener("click", () => {
    el.classList.toggle("open");
    selectFolder(node, header, path);
  });
  el.appendChild(header);
  el.appendChild(children);
  return el;
}

function renderFile(note) {
  const el = document.createElement("div");
  el.className = "row file";
  const title = (note.title && note.title.trim()) || "untitled";
  el.innerHTML = fileSvg + '<span class="name">' + escapeHtml(title) +
    '<span class="ext">.md</span></span>' +
    '<span class="dots" role="button" aria-label="menu">⋮</span>';
  el.querySelector(".dots").addEventListener("click", (e) => {
    e.stopPropagation();
    openMenu({ type: "note", id: note.id, path: note.path, name: title }, e.currentTarget);
  });
  el.addEventListener("click", () => openCard(note, el));
  return el;
}

function renderTree(notes) {
  const notesArr = Array.isArray(notes) ? notes : [];
  const root = buildTree(notesArr);
  const mount = document.getElementById("tree");
  mount.innerHTML = "";
  selectedRow = null;
  setStatus("All", countNotes(root), countLinks(root));   // default scope: the whole vault

  const rootFolders = Object.keys(root.folders).sort((a, b) => a.localeCompare(b));
  if (!rootFolders.length && !root.files.length) {
    mount.innerHTML = '<div class="empty">No notes yet.<br>Send one to the bot to get started.</div>';
    return;
  }
  for (const f of rootFolders) mount.appendChild(renderFolder(f, root.folders[f], false, f));
  for (const file of root.files) mount.appendChild(renderFile(file));
}

/* ------- Note card ------- */
let activeEl = null;
let cardReq = 0;   // guards against a stale fetch landing after a newer card opens

async function fetchNote(id) {
  const base = window.__API_BASE__;
  if (!base) return null;
  try {
    const res = await fetch(base.replace(/\/$/, "") + "/webapp/notes/" + encodeURIComponent(id), {
      headers: { "X-Telegram-Init-Data": INIT_DATA },
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (e) {
    console.warn("Note detail unavailable:", e);
    return null;
  }
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function setBody(text, muted) {
  const body = document.getElementById("cardBody");
  body.textContent = text;
  body.classList.toggle("muted", !!muted);
}

function renderLinks(detail) {
  const wrap = document.getElementById("cardLinks");
  wrap.innerHTML = "";

  // Direction (links vs backlinks) is kept in the API for the future map view;
  // here we show a single de-duplicated "Linked notes" list.
  const seen = new Set();
  const items = [];
  for (const it of [...(detail.links || []), ...(detail.backlinks || [])]) {
    if (seen.has(it.id)) continue;
    seen.add(it.id);
    items.push(it);
  }

  const label = document.createElement("div");
  label.className = "links-label";
  label.textContent = items.length ? "🔗 Linked notes" : "No linked notes yet";
  wrap.appendChild(label);

  if (!items.length) return;
  const row = document.createElement("div");
  row.className = "links-row";
  for (const it of items) {
    const b = document.createElement("button");
    b.className = "link-chip";
    b.textContent = "🔗 " + (it.title || "untitled");
    // One hop per tap — no recursion; navigate to the linked note's preview.
    b.addEventListener("click", () => openCard({ id: it.id, title: it.title }, null));
    row.appendChild(b);
  }
  wrap.appendChild(row);
}

async function openCard(note, el) {
  if (activeEl) activeEl.classList.remove("active");
  activeEl = null;
  if (el) { el.classList.add("active"); activeEl = el; }   // el is null for link navigation
  document.getElementById("cardTitle").textContent = ((note.title || "untitled")) + ".md";
  document.getElementById("cardPath").textContent = "📁 " + (note.path || "Inbox");
  document.getElementById("cardMeta").textContent = "";
  document.getElementById("cardLinks").innerHTML = "";
  setBody("Loading…", true);
  document.getElementById("sheet").classList.add("show");
  document.getElementById("backdrop").classList.add("show");
  tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();

  const req = ++cardReq;
  const detail = await fetchNote(note.id);
  if (req !== cardReq) return;   // a newer card was opened meanwhile

  if (!detail) {
    setBody("Preview unavailable.", true);
    return;
  }
  // Authoritative header from the loaded note (matters for link navigation,
  // where the passed note only carries id + title).
  document.getElementById("cardTitle").textContent = ((detail.title || note.title || "untitled")) + ".md";
  document.getElementById("cardPath").textContent = "📁 " + (detail.path || "Inbox");

  const meta = [];
  if (detail.tags && detail.tags.length) meta.push("🏷 " + detail.tags.join(", "));
  const date = fmtDate(detail.created_at);
  if (date) meta.push(date);
  document.getElementById("cardMeta").textContent = meta.join("   ·   ");

  const text = (detail.text || "").trim();
  if (text) setBody(text, false);
  else setBody("(empty note)", true);

  renderLinks(detail);
}
function closeCard() {
  document.getElementById("sheet").classList.remove("show");
  document.getElementById("backdrop").classList.remove("show");
  if (activeEl) { activeEl.classList.remove("active"); activeEl = null; }
}
document.getElementById("backdrop").addEventListener("click", closeCard);

/* ------- ⋮ context menu + change-path sheet ------- */
let menuTarget = null;   // { type:'folder'|'note', path, id?, name }
function closeCtxMenu() { document.getElementById("ctxMenu").classList.remove("show"); }
function hideActionSheets() {
  closeCtxMenu();
  document.getElementById("pathSheet").classList.remove("show");
  document.getElementById("menuBackdrop").classList.remove("show");
}
function openMenu(target, anchor) {
  menuTarget = target;
  const menu = document.getElementById("ctxMenu");
  menu.classList.add("show");                       // show first to measure it
  const r = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
  let top = r.bottom + 4;
  if (top + mh > window.innerHeight - 8) top = r.top - mh - 4;   // flip up if no room below
  menu.style.left = left + "px";
  menu.style.top = Math.max(8, top) + "px";
}
function openPathSheet() {
  if (!menuTarget) return;
  closeCtxMenu();
  document.getElementById("pathTitle").textContent =
    menuTarget.type === "folder" ? "Rename folder path" : "Change note path";
  document.getElementById("pathInput").value = menuTarget.path || "";
  document.getElementById("pathError").textContent = "";
  document.getElementById("pathSheet").classList.add("show");
  document.getElementById("menuBackdrop").classList.add("show");
  setTimeout(() => document.getElementById("pathInput").focus(), 60);
}
async function apiPost(path, body) {
  const base = window.__API_BASE__;
  if (!base) return { ok: false, status: 0 };
  try {
    return await fetch(base.replace(/\/$/, "") + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": INIT_DATA },
      body: JSON.stringify(body),
    });
  } catch (e) { console.warn("POST failed:", e); return { ok: false, status: 0 }; }
}
async function savePath() {
  if (!menuTarget) return;
  const val = (document.getElementById("pathInput").value || "").trim();
  const err = document.getElementById("pathError");
  if (!val) { err.textContent = "Enter a path."; return; }
  const res = menuTarget.type === "note"
    ? await apiPost("/webapp/notes/" + encodeURIComponent(menuTarget.id) + "/path", { path: val })
    : await apiPost("/webapp/folder/move", { old_path: menuTarget.path, new_path: val });
  if (!res || !res.ok) {
    err.textContent = (res && res.status === 422)
      ? "Path must start with a root folder." : "Couldn't save. Try again.";
    return;
  }
  hideActionSheets();
  renderTree(await fetchNotes());   // regroup the tree with the new path
  tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred && tg.HapticFeedback.notificationOccurred("success");
}
document.getElementById("menuBackdrop").addEventListener("click", hideActionSheets);
document.getElementById("menuChangePath").addEventListener("click", openPathSheet);
document.getElementById("pathCancel").addEventListener("click", hideActionSheets);
document.getElementById("pathSave").addEventListener("click", savePath);
document.getElementById("pathInput").addEventListener("keydown", (e) => { if (e.key === "Enter") savePath(); });
// Dismiss the context menu on any outside click or when the tree scrolls.
document.addEventListener("click", (e) => {
  const menu = document.getElementById("ctxMenu");
  if (menu.classList.contains("show") && !menu.contains(e.target)) closeCtxMenu();
});
document.querySelector("main").addEventListener("scroll", closeCtxMenu, true);

/* ------- Connections map (canvas force-directed graph) ------- */
const GRAPH = { canvas: null, ctx: null, dpr: 1, sim: null, raf: null,
  running: false, loaded: false, selected: null, view: { scale: 1, tx: 0, ty: 0 } };

function rootFolder(path) { const s = (path || "Inbox").split("/")[0].trim(); return s || "Inbox"; }
function folderColor(name) {
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return "hsl(" + (h % 360) + ",55%,62%)";
}
function truncateLabel(ctx, s, maxW) {
  s = String(s || "");
  if (ctx.measureText(s).width <= maxW) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ctx.measureText(s.slice(0, mid) + "…").width <= maxW) lo = mid; else hi = mid - 1; }
  return s.slice(0, lo) + "…";
}
function nodeRadius(n) { return 4 + Math.min(11, (n.degree || 0) * 1.6); }

function DEMO_GRAPH() {
  const byFolder = {};
  for (const n of SAMPLE_NOTES) (byFolder[n.path] = byFolder[n.path] || []).push(n.id);
  const edges = [];
  for (const k in byFolder) { const ids = byFolder[k]; for (let i = 1; i < ids.length; i++) edges.push({ source: ids[i - 1], target: ids[i] }); }
  edges.push({ source: 1, target: 9 }, { source: 9, target: 11 });
  const deg = {}; edges.forEach(e => { deg[e.source] = (deg[e.source] || 0) + 1; deg[e.target] = (deg[e.target] || 0) + 1; });
  const nodes = SAMPLE_NOTES.map(n => ({ id: n.id, title: n.title, path: n.path, degree: deg[n.id] || 0 }))
    .filter(n => n.degree > 0);
  return { nodes, edges };
}

async function fetchGraph() {
  const base = window.__API_BASE__;
  if (!base) return DEMO_GRAPH();
  try {
    const res = await fetch(base.replace(/\/$/, "") + "/webapp/graph", { headers: { "X-Telegram-Init-Data": INIT_DATA } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (e) { console.warn("Graph API unavailable:", e); return DEMO_GRAPH(); }
}

function buildSim(data, W, H) {
  const spread = Math.min(W, H) * 0.5 || 200;
  const nodes = data.nodes.map(n => ({ ...n, x: (Math.random() - .5) * spread, y: (Math.random() - .5) * spread, vx: 0, vy: 0 }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const edges = (data.edges || []).map(e => ({ a: byId.get(e.source), b: byId.get(e.target) })).filter(e => e.a && e.b);
  return { nodes, edges, alpha: 1 };
}

function stepSim(sim) {
  const nodes = sim.nodes, a = sim.alpha;
  const REPEL = 1600, SPRING = 0.02, LEN = 64, CENTER = 0.015, DAMP = 0.85;
  for (let i = 0; i < nodes.length; i++) {
    const ni = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const nj = nodes[j];
      let dx = ni.x - nj.x, dy = ni.y - nj.y, d2 = dx * dx + dy * dy;
      if (d2 < 0.01) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = dx * dx + dy * dy + 0.01; }
      const inv = 1 / Math.sqrt(d2), f = REPEL / d2, fx = dx * inv * f, fy = dy * inv * f;
      ni.vx += fx; ni.vy += fy; nj.vx -= fx; nj.vy -= fy;
    }
  }
  for (const e of sim.edges) {
    let dx = e.b.x - e.a.x, dy = e.b.y - e.a.y; const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const f = (d - LEN) * SPRING, fx = dx / d * f, fy = dy / d * f;
    e.a.vx += fx; e.a.vy += fy; e.b.vx -= fx; e.b.vy -= fy;
  }
  for (const n of nodes) {
    n.vx += -n.x * CENTER; n.vy += -n.y * CENTER;
    n.x += n.vx * a; n.y += n.vy * a;
    n.vx *= DAMP; n.vy *= DAMP;
  }
  sim.alpha = Math.max(0.03, a * 0.985);
}

function sizeCanvas() {
  const c = GRAPH.canvas; if (!c) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2); GRAPH.dpr = dpr;
  c.width = Math.round(c.clientWidth * dpr); c.height = Math.round(c.clientHeight * dpr);
}

function autoFit() {
  const { sim, canvas, view } = GRAPH; if (!sim || !sim.nodes.length) return;
  let a = 1e9, b = 1e9, c = -1e9, d = -1e9;
  for (const n of sim.nodes) { a = Math.min(a, n.x); c = Math.max(c, n.x); b = Math.min(b, n.y); d = Math.max(d, n.y); }
  const w = canvas.clientWidth, h = canvas.clientHeight, gw = Math.max(1, c - a), gh = Math.max(1, d - b);
  view.scale = Math.min(w / (gw + 120), h / (gh + 120), 2);
  view.tx = w / 2 - (a + c) / 2 * view.scale;
  view.ty = h / 2 - (b + d) / 2 * view.scale;
}

function drawGraph() {
  const { ctx, canvas, sim, view, dpr, selected } = GRAPH; if (!ctx || !sim) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(view.tx, view.ty); ctx.scale(view.scale, view.scale);
  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1 / view.scale;
  ctx.beginPath();
  for (const e of sim.edges) { ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); }
  ctx.stroke();
  for (const n of sim.nodes) {
    ctx.beginPath(); ctx.arc(n.x, n.y, nodeRadius(n), 0, Math.PI * 2);
    ctx.fillStyle = folderColor(rootFolder(n.path)); ctx.fill();
    if (selected === n.id) { ctx.lineWidth = 2 / view.scale; ctx.strokeStyle = "#fff"; ctx.stroke(); }
  }
  ctx.restore();
  drawLabels();
}

function drawLabels() {
  const { ctx, sim, view, selected } = GRAPH;
  ctx.font = "11px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.textBaseline = "top";
  const showAll = sim.nodes.length <= 14, placed = [];
  let count = 0;
  for (const n of [...sim.nodes].sort((x, y) => (y.degree || 0) - (x.degree || 0))) {
    if (count >= 36) break;
    const isSel = selected === n.id;
    if (!showAll && !isSel && (n.degree || 0) < 2) continue;
    const sx = n.x * view.scale + view.tx, sy = n.y * view.scale + view.ty;
    const label = truncateLabel(ctx, n.title, 120), tw = ctx.measureText(label).width;
    const bx = sx - tw / 2, by = sy + nodeRadius(n) * view.scale + 2, bw = tw, bh = 13;
    if (!isSel && placed.some(p => bx < p.x + p.w && bx + bw > p.x && by < p.y + p.h && by + bh > p.y)) continue;
    placed.push({ x: bx, y: by, w: bw, h: bh });
    ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(bx - 3, by - 1, bw + 6, bh + 2);
    ctx.fillStyle = isSel ? "#fff" : "rgba(230,230,230,.92)"; ctx.fillText(label, bx, by);
    count++;
  }
}

function graphEmptyMessage(msg) {
  const { ctx, canvas, dpr } = GRAPH;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  ctx.fillStyle = "rgba(150,150,150,.85)"; ctx.font = "13px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(msg, canvas.clientWidth / 2, canvas.clientHeight / 2); ctx.textAlign = "start";
}

function graphLoop() {
  if (!GRAPH.running) return;
  stepSim(GRAPH.sim); drawGraph();
  GRAPH.raf = requestAnimationFrame(graphLoop);
}
function startGraphLoop() { if (GRAPH.running || !GRAPH.sim) return; GRAPH.running = true; GRAPH.raf = requestAnimationFrame(graphLoop); }
function stopGraphLoop() { GRAPH.running = false; if (GRAPH.raf) cancelAnimationFrame(GRAPH.raf); GRAPH.raf = null; }

function zoomAt(cx, cy, factor) {
  const v = GRAPH.view, gx = (cx - v.tx) / v.scale, gy = (cy - v.ty) / v.scale;
  v.scale = Math.max(0.2, Math.min(4, v.scale * factor));
  v.tx = cx - gx * v.scale; v.ty = cy - gy * v.scale;
}
function graphTap(clientX, clientY) {
  const c = GRAPH.canvas, rect = c.getBoundingClientRect(), v = GRAPH.view;
  const gx = (clientX - rect.left - v.tx) / v.scale, gy = (clientY - rect.top - v.ty) / v.scale;
  let best = null, bestd = 1e9;
  for (const n of (GRAPH.sim ? GRAPH.sim.nodes : [])) {
    const r = nodeRadius(n) + 8, dx = n.x - gx, dy = n.y - gy, d = dx * dx + dy * dy;
    if (d < r * r && d < bestd) { best = n; bestd = d; }
  }
  if (best) { GRAPH.selected = best.id; openCard({ id: best.id, title: best.title }, null); }
}
function setupGraphInput() {
  const c = GRAPH.canvas; if (!c || c._wired) return; c._wired = true;
  const pointers = new Map(); let last = null, moved = 0, pinch = 0;
  c.addEventListener("pointerdown", (e) => {
    c.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    last = { x: e.clientX, y: e.clientY }; moved = 0;
    if (pointers.size === 2) { const p = [...pointers.values()]; pinch = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); }
  });
  c.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const p = [...pointers.values()], d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      if (pinch > 0) { const rect = c.getBoundingClientRect(); zoomAt((p[0].x + p[1].x) / 2 - rect.left, (p[0].y + p[1].y) / 2 - rect.top, d / pinch); }
      pinch = d; moved = 999; return;
    }
    if (last) { const dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy); GRAPH.view.tx += dx; GRAPH.view.ty += dy; last = { x: e.clientX, y: e.clientY }; }
  });
  const up = (e) => {
    if (!pointers.has(e.pointerId)) return;
    if (pointers.size === 1 && moved < 6) graphTap(e.clientX, e.clientY);
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = 0;
    last = pointers.size === 1 ? [...pointers.values()][0] : null;
  };
  c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
  c.addEventListener("wheel", (e) => { e.preventDefault(); const rect = c.getBoundingClientRect(); zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.1 : 0.9); }, { passive: false });
}

async function ensureGraph() {
  GRAPH.canvas = document.getElementById("graph");
  GRAPH.ctx = GRAPH.canvas.getContext("2d");
  sizeCanvas();
  setupGraphInput();
  if (GRAPH.loaded) { startGraphLoop(); return; }
  GRAPH.loaded = true;
  const data = await fetchGraph();
  if (!data.nodes || !data.nodes.length) { graphEmptyMessage("No connections yet — link notes in the bot."); return; }
  GRAPH.sim = buildSim(data, GRAPH.canvas.clientWidth, GRAPH.canvas.clientHeight);
  for (let i = 0; i < 80; i++) stepSim(GRAPH.sim);   // warm up before first paint
  autoFit();
  startGraphLoop();
}

window.addEventListener("resize", () => {
  if (document.getElementById("map").classList.contains("hidden")) return;
  sizeCanvas(); autoFit();
});

/* ------- Tabs (Browser | Map) ------- */
document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b === btn));
    const view = btn.dataset.view;
    document.getElementById("tree").classList.toggle("hidden", view !== "browser");
    document.getElementById("map").classList.toggle("hidden", view !== "map");
    if (view === "map") ensureGraph(); else stopGraphLoop();
    tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
  });
});

/* ------- Utils ------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ------- Boot ------- */
(async function () {
  renderTree(await fetchNotes());
})();
</script>
