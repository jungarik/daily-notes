<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Notes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg:            #1e1e1e;   /* Obsidian dark primary */
    --bg-alt:        #191919;
    --bg-elev:       #262626;
    --border:        #333333;
    --text:          #dcddde;
    --text-muted:    #8a8a8e;
    --text-faint:    #6a6a6e;
    --accent:        #a482ff;   /* Obsidian violet */
    --accent-soft:   rgba(164,130,255,0.14);
    --hover:         rgba(255,255,255,0.05);
    --mono: "JetBrains Mono","SFMono-Regular",ui-monospace,"Cascadia Code",
            Consolas,"Liberation Mono",Menlo,monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 300;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  header {
    position: sticky; top: 0; z-index: 5;
    padding: 14px 16px 10px;
    background: var(--bg-alt);
    border-bottom: 1px solid var(--border);
  }
  .tabs { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .tab {
    flex: 1; padding: 7px 10px;
    background: transparent; border: none; border-radius: 6px;
    color: var(--text-muted); font-family: var(--mono); font-size: 13px; font-weight: 400;
    cursor: pointer; transition: background .12s ease, color .12s ease;
  }
  .tab.active { background: var(--accent-soft); color: var(--text); }

  .view.hidden { display: none; }

  main { flex: 1; overflow-y: auto; padding: 6px 8px 40px; }

  .row {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .row:hover { background: var(--hover); }
  .row .name { overflow: hidden; text-overflow: ellipsis; }

  .folder > .row .count { margin-left: auto; color: var(--text-faint); font-size: 11px; }
  .folder > .row .chevron {
    width: 0; height: 0; flex: none;
    border-left: 5px solid var(--text-muted);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform .12s ease;
  }
  .folder.open > .row .chevron { transform: rotate(90deg); }
  .folder .children { display: none; margin-left: 10px; border-left: 1px solid var(--border); padding-left: 4px; }
  .folder.open > .children { display: block; }

  .file .name { color: var(--text); }
  .file .name .ext { color: var(--text-faint); }
  .file.active { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }

  .ico { flex: none; opacity: .85; }
  .folder > .row .ico { color: var(--text-muted); }
  .file .ico { color: var(--text-muted); }

  .empty { text-align: center; color: var(--text-faint); padding: 48px 20px; font-size: 13px; }

  /* Note card (stub for now) */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 20;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    padding: 14px 18px 26px;
    transform: translateY(100%);
    transition: transform .22s cubic-bezier(.2,.8,.2,1);
    max-height: 80%;
  }
  .sheet.show { transform: translateY(0); }
  .sheet .grip { width: 36px; height: 4px; border-radius: 3px; background: var(--border); margin: 0 auto 12px; }
  .sheet .card-title { font-size: 16px; font-weight: 400; word-break: break-word; }
  .sheet .card-path { margin-top: 4px; color: var(--accent); font-size: 12px; }
  .sheet .card-body { margin-top: 14px; color: var(--text-muted); font-size: 13px; border-top: 1px dashed var(--border); padding-top: 12px; }
</style>
</head>
<body>
  <header>
    <div class="tabs">
      <button class="tab active" data-view="browser">Browser</button>
      <button class="tab" data-view="map">Map</button>
    </div>
  </header>

  <main>
    <div id="tree" class="view"></div>
    <div id="map" class="view hidden">
      <div class="empty">🕸  Mind-map coming soon.</div>
    </div>
  </main>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="grip"></div>
    <div class="card-title" id="cardTitle"></div>
    <div class="card-path" id="cardPath"></div>
    <div class="card-body">Note preview & mind-map open here next. (coming soon)</div>
  </div>

<script>
"use strict";

/* ------- Telegram Mini App integration (no-op in a plain browser) ------- */
const tg = window.Telegram && window.Telegram.WebApp;
let INIT_DATA = "";
if (tg) {
  try {
    tg.ready();
    tg.expand();
    tg.setHeaderColor && tg.setHeaderColor("#191919");
    tg.setBackgroundColor && tg.setBackgroundColor("#1e1e1e");
    INIT_DATA = tg.initData || "";
  } catch (e) { /* ignore */ }
}

/* ------- Data source -------
   Swap point for the real backend. When the API is publicly reachable, set
   window.__API_BASE__ (e.g. the deployed API URL) and this will call
   GET {API_BASE}/webapp/notes with the Telegram initData for auth, expecting
   [{ id, title, path }]. Until then it falls back to SAMPLE_NOTES so the UI
   renders on its own. */
// Served from the API's own domain, so same-origin works; the explicit https
// URL is a fallback. (A bare host with no scheme would be treated as a relative
// path and fail — always include https://.)
window.__API_BASE__ = window.__API_BASE__
  || location.origin
  || "https://scintillating-celebration-production-69b8.up.railway.app";

const SAMPLE_NOTES = [
  { id: 1,  title: "Refactor bot to call API", path: "Projects/daily-notes" },
  { id: 2,  title: "Atomize multi-idea dumps", path: "Projects/daily-notes" },
  { id: 3,  title: "Google Calendar integration idea", path: "Projects/daily-notes" },
  { id: 4,  title: "Ship the note-browser mini app", path: "Projects/webapp" },
  { id: 5,  title: "Mindmap graph view (later)", path: "Projects/webapp" },
  { id: 6,  title: "Morning stretch routine", path: "Areas/health" },
  { id: 7,  title: "Sleep before midnight", path: "Areas/health" },
  { id: 8,  title: "Quarterly budget review", path: "Areas/finance" },
  { id: 9,  title: "PARA method overview", path: "Resources/productivity" },
  { id: 10, title: "Zettelkasten linking notes", path: "Resources/productivity" },
  { id: 11, title: "pgvector cheatsheet", path: "Resources/postgres" },
  { id: 12, title: "Old side project postmortem", path: "Archive" },
  { id: 13, title: "Random thought about coffee", path: "Inbox" },
  { id: 14, title: "Call the dentist", path: "Inbox" },
];

async function fetchNotes() {
  const base = window.__API_BASE__;
  if (!base) return SAMPLE_NOTES;
  try {
    const res = await fetch(base.replace(/\/$/, "") + "/webapp/notes", {
      headers: { "X-Telegram-Init-Data": INIT_DATA },
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    return Array.isArray(data) ? data : (data.notes || []);
  } catch (e) {
    console.warn("Notes API unavailable, using sample data:", e);
    return SAMPLE_NOTES;
  }
}

/* ------- Tree building ------- */
function buildTree(notes) {
  const root = { folders: {}, files: [] };
  for (const n of notes) {
    const path = (n.path || "Inbox").trim() || "Inbox";
    const parts = path.split("/").map(p => p.trim()).filter(Boolean);
    let node = root;
    for (const part of parts) {
      node.folders[part] = node.folders[part] || { folders: {}, files: [] };
      node = node.folders[part];
    }
    node.files.push(n);
  }
  return root;
}

function countNotes(node) {
  let c = node.files.length;
  for (const k in node.folders) c += countNotes(node.folders[k]);
  return c;
}

/* ------- Icons ------- */
const folderSvg =
  '<svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>';
const fileSvg =
  '<svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 2h8l4 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v5h5"/></svg>';

/* ------- Rendering ------- */
function renderFolder(name, node, forceOpen) {
  const el = document.createElement("div");
  el.className = "folder" + (forceOpen ? " open" : "");
  const header = document.createElement("div");
  header.className = "row";
  header.innerHTML =
    '<span class="chevron"></span>' + folderSvg +
    '<span class="name">' + escapeHtml(name) + '</span>' +
    '<span class="count">' + countNotes(node) + '</span>';
  const children = document.createElement("div");
  children.className = "children";

  const folderNames = Object.keys(node.folders).sort((a, b) => a.localeCompare(b));
  for (const f of folderNames) children.appendChild(renderFolder(f, node.folders[f], forceOpen));
  const files = node.files.slice().sort((a, b) => (a.title || "").localeCompare(b.title || ""));
  for (const file of files) children.appendChild(renderFile(file));

  header.addEventListener("click", () => el.classList.toggle("open"));
  el.appendChild(header);
  el.appendChild(children);
  return el;
}

function renderFile(note) {
  const el = document.createElement("div");
  el.className = "row file";
  const title = (note.title && note.title.trim()) || "untitled";
  el.innerHTML = fileSvg + '<span class="name">' + escapeHtml(title) + '<span class="ext">.md</span></span>';
  el.addEventListener("click", () => openCard(note, el));
  return el;
}

function renderTree(notes) {
  const notesArr = Array.isArray(notes) ? notes : [];
  const root = buildTree(notesArr);
  const mount = document.getElementById("tree");
  mount.innerHTML = "";

  const rootFolders = Object.keys(root.folders).sort((a, b) => a.localeCompare(b));
  if (!rootFolders.length && !root.files.length) {
    mount.innerHTML = '<div class="empty">No notes yet.<br>Send one to the bot to get started.</div>';
    return;
  }
  for (const f of rootFolders) mount.appendChild(renderFolder(f, root.folders[f], false));
  for (const file of root.files) mount.appendChild(renderFile(file));
}

/* ------- Note card (stub) ------- */
let activeEl = null;
function openCard(note, el) {
  if (activeEl) activeEl.classList.remove("active");
  el.classList.add("active");
  activeEl = el;
  document.getElementById("cardTitle").textContent = ((note.title || "untitled")) + ".md";
  document.getElementById("cardPath").textContent = "📁 " + (note.path || "Inbox");
  document.getElementById("sheet").classList.add("show");
  document.getElementById("backdrop").classList.add("show");
  tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
}
function closeCard() {
  document.getElementById("sheet").classList.remove("show");
  document.getElementById("backdrop").classList.remove("show");
  if (activeEl) { activeEl.classList.remove("active"); activeEl = null; }
}
document.getElementById("backdrop").addEventListener("click", closeCard);

/* ------- Tabs (Browser | Map) ------- */
document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b === btn));
    const view = btn.dataset.view;
    document.getElementById("tree").classList.toggle("hidden", view !== "browser");
    document.getElementById("map").classList.toggle("hidden", view !== "map");
    tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();
  });
});

/* ------- Utils ------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ------- Boot ------- */
(async function () {
  renderTree(await fetchNotes());
})();
</script>
</body>
</html>
